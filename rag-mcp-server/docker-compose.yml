services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-mcp-backend
    restart: unless-stopped
    ports:
      - "8900:8000"
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/chromadb:/app/data/chromadb
      - ./data/config:/app/data/config
      # Optional: mount the Unraid host notify script to enable system
      # notifications on sync complete/failed (safe to leave commented out).
      # - /usr/local/emhttp/webGui/scripts/notify:/usr/local/bin/unraid-notify:ro
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chromadb
      - DOCUMENTS_DIR=/app/data/documents
      - CONFIG_DIR=/app/data/config
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://192.168.1.52:8902,http://localhost:8902,https://192.168.1.52:8943,https://localhost:8943}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 6G
    networks:
      - rag-network

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: rag-mcp-server
    restart: unless-stopped
    ports:
      - "8901:8001"
    volumes:
      - ./data/config:/app/data/config:ro
    environment:
      - BACKEND_URL=http://backend:8000
      - CONFIG_DIR=/app/data/config
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://192.168.1.52:8902,http://localhost:8902,https://192.168.1.52:8943,https://localhost:8943}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-192.168.1.52:8901,192.168.1.52:8902,192.168.1.52:8943,localhost:8901,localhost:8902,localhost:8943,mcp-server:8001}
      # Optional override. If unset, the MCP server uses the service key the
      # backend auto-provisions to the shared config volume (data/config/mcp_service.key).
      - MCP_BACKEND_KEY=${MCP_BACKEND_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-mcp-frontend
    restart: unless-stopped
    ports:
      - "8902:80"
      - "8943:443"
    volumes:
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      mcp-server:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
