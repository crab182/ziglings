# GPU override for NVIDIA acceleration (e.g. RTX 5070 via oculink).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Requirements on the Unraid host:
#   - NVIDIA driver installed (Unraid: "Nvidia Driver" plugin)
#   - nvidia-container-toolkit / runtime available to Docker
#   - Verify with: nvidia-smi   (should list the 5070)
#
# This rebuilds the backend with CUDA-enabled torch, adds an Ollama service
# for local LLM answer generation, and reserves the GPU for both.

services:
  backend:
    build:
      args:
        TORCH_VARIANT: cu128   # CUDA 12.8 — required for Blackwell/sm_120 (5070)
    environment:
      - EMBEDDING_DEVICE=cuda
      - LLM_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:14b}
      - ENABLE_HYDE=1   # local LLM is present on GPU deploys, so HyDE is worthwhile
      # Contextual retrieval enriches chunks at ingest via the LLM (big retrieval
      # win, slower ingestion). Off by default; set to 1 to enable.
      - ENABLE_CONTEXTUAL_INGEST=${ENABLE_CONTEXTUAL_INGEST:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: rag-mcp-ollama
    restart: unless-stopped
    # Serve, then pull the model in the background (idempotent — a no-op once cached).
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5; ollama pull ${LLM_MODEL:-qwen2.5:14b}; wait"]
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 14G
    networks:
      - rag-network
